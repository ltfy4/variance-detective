[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "variance-detective"
version = "0.1.0"
description = "Tech-agnostic, evidence-backed variance investigation agent for FP&A. Connects to any planning/ERP system over MCP, runs deterministic analysis, and writes narratives in which every number is traceable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lütfiye Aykaç Öztürk" }]
keywords = ["fp&a", "variance-analysis", "mcp", "agent", "epm", "planning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.7",
  "mcp>=1.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
bedrock = ["boto3>=1.34"]
azure = ["openai>=1.40"]
openai = ["openai>=1.40"]
all = ["anthropic>=0.40", "boto3>=1.34", "openai>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
vd = "variance_detective.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/variance_detective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "E731", "B007", "B008", "B905", "SIM108", "SIM117"]
